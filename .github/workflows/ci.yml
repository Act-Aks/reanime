name: Android CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  conventions:
    name: Contribution conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test CI helpers
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check Conventional Commit PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check_pr_title.py

  foundation:
    name: Android verification
    needs: conventions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Read and validate catalog and wrapper settings
        id: config
        run: python3 .github/scripts/ci_config.py
      - name: Install build and compilation JDKs
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # The last JDK is the runtime; the first remains available as a toolchain.
          java-version: |
            ${{ steps.config.outputs.toolchain_java }}
            ${{ steps.config.outputs.build_java }}
      - name: Set up Android command-line tools and accept SDK licenses
        uses: android-actions/setup-android@v3
        with:
          # v3 defaults to "tools platform-tools"; the legacy tools package is obsolete.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Set up Gradle and validate wrapper JARs
        uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true
          cache-read-only: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
      - name: Install Android SDK components
        env:
          SDK_PACKAGE: ${{ steps.config.outputs.sdk_package }}
        run: sdkmanager "$SDK_PACKAGE"
      - name: Verify foundation and minified release build
        env:
          JAVA_ENVIRONMENTS: ${{ steps.config.outputs.java_environments }}
        run: >-
          ./gradlew verifyFoundation verifyRelease
          "-Porg.gradle.java.installations.fromEnv=$JAVA_ENVIRONMENTS"
          --continue --stacktrace --console=plain
      - name: Upload verification reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: verification-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/reports/
            app/build/reports/
            app/build/test-results/
            core/designsystem/build/reports/
            core/designsystem/build/test-results/
            core/model/build/reports/
            core/model/build/test-results/
            core/network/build/reports/
            core/network/build/test-results/
            core/data/build/reports/
            core/data/build/test-results/
            source/reanime/build/reports/
            source/reanime/build/test-results/
            feature/home/build/reports/
            feature/home/build/test-results/
            build-logic/build/reports/
            build-logic/convention/build/reports/
            build-logic/convention/build/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload development APK from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        uses: actions/upload-artifact@v6
        with:
          name: reanime-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ci:
    name: CI
    if: ${{ always() && !cancelled() }}
    needs: [conventions, foundation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all verification jobs to pass
        env:
          CONVENTIONS_RESULT: ${{ needs.conventions.result }}
          ANDROID_RESULT: ${{ needs.foundation.result }}
        run: |
          if [[ "$CONVENTIONS_RESULT" != success || "$ANDROID_RESULT" != success ]]; then
            echo 'One or more required verification jobs failed or were skipped.'
            exit 1
          fi
          echo 'All verification jobs passed.'
