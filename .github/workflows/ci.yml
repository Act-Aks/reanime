name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Read build settings from version catalog
        id: config
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          with open('gradle/libs.versions.toml', 'rb') as source:
              versions = tomllib.load(source)['versions']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"java={int(versions['projectJavaVersion'])}", file=output)
              print(f"compile_sdk={int(versions['projectCompileSdkVersion'])}", file=output)
          PY
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: ${{ steps.config.outputs.java }}
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Install Android SDK components
        env:
          COMPILE_SDK: ${{ steps.config.outputs.compile_sdk }}
        run: sdkmanager "platforms;android-${COMPILE_SDK}"
      - name: Verify foundation
        run: ./gradlew verifyFoundation --stacktrace
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-reports
          path: |
            **/build/reports/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 7
