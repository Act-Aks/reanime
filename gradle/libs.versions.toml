ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
reanime-android-application = { id = "reanime.android.application" }
reanime-android-library = { id = "reanime.android.library" }
reanime-android-compose = { id = "reanime.android.compose" }
